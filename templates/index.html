<!DOCTYPE html>
<html>
<head>
    <title>Student API Interface</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; background: #f4f6fa; }
        h1, h2 { color: #1f6f4a; }
        h2 { margin-top: 0; }
        section { background: #fff; padding: 16px; margin: 16px 0; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
        button { padding: 8px 14px; margin: 5px; cursor: pointer; background: #1f6f4a; color: #fff; border: 0; border-radius: 4px; }
        input { padding: 8px; }
        #result { margin-top: 20px; padding: 10px; border: 1px solid #cccccc; }
        pre { background: #f0f2f6; padding: 10px; border-radius: 4px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Student API Interface</h1>

    <section>
    <h2>Student Information</h2>
    <button onclick="loadStudent()">Load Student Information</button>
    <div id="result"></div>
    </section>

    <section>
    <h2>Greeting API</h2>
    <input type="text" id="nameInput" placeholder="Enter your first name">
    <button onclick="sayHello()">Say Hello</button>
    <p id="greeting"></p>
    </section>

    <section>
    <h2>Grade API (/grade)</h2>
    <input type="number" id="customInput" placeholder="Enter a score (0-100)">
    <button onclick="loadCustom()">Check Grade</button>
    <pre id="customResult"></pre>
    </section>

    <section>
    <h2>Students from Database</h2>
    <button onclick="loadStudents()">Load Students</button>
    <div id="studentList"></div>
    </section>

    <section>
    <h2>Find Student by Database ID</h2>
    <input type="number" id="idInput" min="1" placeholder="e.g. 1 or 2">
    <button onclick="findStudent()">Find Student</button>
    <div id="studentOne"></div>
    </section>

    <section>
    <h2>Filter Students by Section</h2>
    <input type="text" id="filterInput" placeholder="A, B, C">
    <button onclick="filterStudents()">Search Section</button>
    <div id="filterList"></div>
    </section>

    <script>
        function loadStudent() {
            fetch('/student')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('result').innerHTML =
                        '<p><b>Student ID:</b> ' + data.student_id + '</p>' +
                        '<p><b>Name:</b> ' + data.name + '</p>' +
                        '<p><b>Program:</b> ' + data.program + '</p>' +
                        '<p><b>Year:</b> ' + data.year + '</p>' +
                        '<p><b>Section:</b> ' + data.section + '</p>';
                })
                .catch(error => {
                    document.getElementById('result').innerHTML =
                        '<p>Unable to retrieve data.</p>';
                });
        }

        function sayHello() {
            const name = document.getElementById('nameInput').value;
            fetch('/hello?name=' + encodeURIComponent(name))
                .then(response => response.json())
                .then(data => {
                    document.getElementById('greeting').innerText = data.message;
                })
                .catch(error => {
                    document.getElementById('greeting').innerText =
                        'Unable to retrieve greeting.';
                });
        }

        function loadCustom() {
            fetch('/grade?score=' + encodeURIComponent(document.getElementById('customInput').value))
                .then(response => response.json())
                .then(data => {
                    document.getElementById('customResult').innerText =
                        JSON.stringify(data, null, 2);
                })
                .catch(error => {
                    document.getElementById('customResult').innerText =
                        'Unable to retrieve data.';
                });
        }

        function esc(v) {
            const d = document.createElement('div');
            d.textContent = v;
            return d.innerHTML;
        }

        function renderStudent(s) {
            return '<p><b>' + esc(s.student_id) + '</b> - ' +
                esc(s.name) + ' | ' +
                esc(s.program) + ' | Year ' +
                esc(s.year) + ' | Section ' +
                esc(s.section) + '</p>';
        }

        function show(url, target, many) {
            const box = document.getElementById(target);
            fetch(url)
                .then(response => response.json().then(data => ({ ok: response.ok, data })))
                .then(({ ok, data }) => {
                    if (!ok) {
                        box.innerHTML = '<p>' + esc(data.error || 'Request failed.') + '</p>';
                    } else if (many) {
                        box.innerHTML = data.length
                            ? data.map(renderStudent).join('')
                            : '<p>No students found.</p>';
                    } else {
                        box.innerHTML = renderStudent(data);
                    }
                })
                .catch(error => {
                    box.innerHTML = '<p>Unable to retrieve student records.</p>';
                });
        }

        function loadStudents() {
            show('/students', 'studentList', true);
        }

        function findStudent() {
            const id = document.getElementById('idInput').value;
            show('/students/' + encodeURIComponent(id), 'studentOne', false);
        }

        function filterStudents() {
            const v = document.getElementById('filterInput').value.trim();
            show('/students/section/' + encodeURIComponent(v), 'filterList', true);
        }
    </script>
</body>
</html>
